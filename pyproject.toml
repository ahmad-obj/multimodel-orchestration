[project]
name = "multimodal-orchestration"
version = "0.1.0"
description = "Vendor-neutral autonomous coding-agent orchestrator"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.22.1",
  "langgraph>=1.2.11",
  "langgraph-checkpoint-sqlite>=3.1.1",
]

[project.scripts]
orchestrate = "orchestrator.cli.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/orchestrator/runtime/langgraph.py" = ["E402"]
"src/orchestrator/cli/app.py" = ["B008"]
"src/orchestrator/workspace/*.py" = ["ASYNC240"]
"tests/**" = ["ASYNC240", "B017"]
